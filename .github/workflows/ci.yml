name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Same command as local: lint, offline tests (synthetic data only, no
      # network, no model key), identifier scan. The personal denylist is
      # git-ignored, so CI runs the built-in patterns only.
      - run: make check
