[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-coach-agent"
version = "0.1.0"
description = "Fitness coaching agent over a source-agnostic training-data store, with an MCP tool server"
requires-python = ">=3.10"
authors = [{ name = "Tyler Lange" }]
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mcp>=1.27,<2", "ruff"]

[tool.setuptools.packages.find]
include = ["strength_coach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
